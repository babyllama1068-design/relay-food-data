name: Weekly food copy

on:
  schedule:
    - cron: "0 5 * * 6"   # Saturdays, 05:00 UTC (5 or 6 am in London)
  workflow_dispatch:       # the Run workflow button: build one now

permissions:
  contents: write          # to commit last-build.json (below)

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download Open Food Facts' export
        run: curl -sSfL --retry 3 -o off.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
      - name: Last week's copy, for the size check
        run: curl -sSfL -o previous.json https://huggingface.co/datasets/Killerfuzzball/relay-food-uk/resolve/main/latest.json || echo '{}' > previous.json
      - name: Build and check
        run: python build.py --off off.csv.gz --out out --previous previous.json
      # Relay believes latest.json only with this signature (FoodCopy.kt), so whoever held the Hugging Face account
      # couldn't change the file and its SHA-256 together. ECDSA P-256, which every Android version Relay runs on checks
      # without a library. The key is only written to a private temporary file, deleted when the step ends; checking
      # against signing-key.pub.pem (the half in Relay) stops a wrong key here, before any phone sees it.
      - name: Sign latest.json
        env:
          SIGNING_KEY: ${{ secrets.FOOD_COPY_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::The FOOD_COPY_SIGNING_KEY secret is missing"; exit 1; fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key" signature.der' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out signature.der out/latest.json
          openssl dgst -sha256 -verify signing-key.pub.pem -signature signature.der out/latest.json
          base64 -w0 signature.der > out/latest.json.sig
      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python publish.py --out out
      # GitHub switches off scheduled runs in a repo with no commits for 60 days; this weekly commit keeps it on,
      # and records what was published.
      - name: Record the build
        # Catch up with GitHub first: anything pushed while this run waited or built would otherwise refuse the push.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python -c "import json; print(json.load(open('out/latest.json'))['version'])")
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main   # out/ is git-ignored, so the build survives this
            cp out/latest.json last-build.json
            git add last-build.json
            git commit -m "Food copy $version" || exit 0
            git push && exit 0
            sleep 10
          done
          exit 1
